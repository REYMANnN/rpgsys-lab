name: lab-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python run_local.py 42 > manifest_github.json && cat manifest_github.json
      - name: Placar até a meta do engenheiro
        run: python -m jobs.progresso
      - uses: actions/upload-artifact@v4
        with:
          name: manifest-github
          path: manifest_github.json

  modal:
    needs: testes
    runs-on: ubuntu-24.04
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt modal
      - name: Pula se o token do Modal não estiver configurado
        id: check
        run: |
          if [ -z "$MODAL_TOKEN_ID" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Segredos do Modal ausentes: job pulado."; fi
      - name: Roda o mesmo job no Modal
        if: steps.check.outputs.skip != 'true'
        run: modal run modal_app.py --seed 42 --out manifest_modal.json
      - name: Compara os hashes GitHub x Modal
        if: steps.check.outputs.skip != 'true'
        run: |
          python run_local.py 42 > manifest_github.json
          python - <<'PY'
          import json
          g = json.load(open("manifest_github.json")); m = json.load(open("manifest_modal.json"))
          assert g["inputs_sha256"] == m["inputs_sha256"], "entradas divergem"
          assert g["outputs_sha256"] == m["outputs_sha256"], "saídas divergem"
          print("OK: GitHub e Modal produziram o mesmo hash:", g["outputs_sha256"])
          PY
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.skip != 'true'
        with:
          name: manifest-modal
          path: manifest_modal.json

  rtl_formal:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install amaranth amaranth-yosys yowasp-yosys z3-solver pyyaml pytest
      - run: python -m pytest -q tests/test_rtl_ama.py
      - run: python formal/ama_formal.py

  sintese_asap7:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install amaranth amaranth-yosys pyyaml
      - run: python sintese/gerar_verilog.py
      - run: docker pull openroad/orfs:latest
      - run: |
          docker run --rm -v ${{ github.workspace }}/sintese:/work openroad/orfs:latest bash -c \
            "source /OpenROAD-flow-scripts/env.sh && make -C /OpenROAD-flow-scripts/flow DESIGN_CONFIG=/work/config.mk WORK_HOME=/work/orfs" 2>&1 | tail -80
      - run: sudo chown -R $USER sintese/orfs && python sintese/extrair.py sintese/orfs
      - uses: actions/upload-artifact@v4
        with:
          name: sintese-asap7
          path: |
            results/G11_sintese.json
            sintese/orfs/reports
            sintese/orfs/results/asap7/ama_pista/base/6_final.gds
            sintese/orfs/logs
