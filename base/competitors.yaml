     nota: "Morgan Stanley: US$55k por GPU em volume para hyperscalers"}
  preco_rack_usd: {nominal: 7800000, low: 5000000, high: 8800000, rotulo: ESTIMADO, nota: "Morgan Stanley ~US$7,8M; cotações US$5–7M; teto US$8,8M", preco_inclui_infra: true}
