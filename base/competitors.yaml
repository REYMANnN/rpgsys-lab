# Concorrentes contra os quais a meta de 3x é medida. O juiz usa o MELHOR
# concorrente comprável (min TCO), não o mais conveniente.
# Origem: AMA512_INPUT_COMPETITORS.md (set/2026) + atualizações nov/2026.

B300:
  memoria_gb: {valor: 288, rotulo: PUBLICADO}
  banda_tb_s: {valor: 8.0, rotulo: PUBLICADO}
  fp4_denso_tflops: {valor: 15000, rotulo: PUBLICADO}
  tdp_w: {valor: 1400, rotulo: PUBLICADO}
  preco_usd: {nominal: 86500, low: 83000, high: 90000, rotulo: DERIVADO, nota: "GB300 NVL72 US$6,0–6,5M / 72", preco_inclui_infra: true}
  disponibilidade: volume

MI355X:
  memoria_gb: {valor: 288, rotulo: PUBLICADO}
